    <script>
      // Cleanly suppress Vite WebSocket reconnection notices in proxied iframe sandbox
      (function() {
        const origError = console.error;
        console.error = function(...args) {
          if (typeof args[0] === 'string' && (args[0].includes('[vite] failed to connect to websocket') || args[0].includes('vite-ping'))) {
            return;
          }
          origError.apply(console, args);
        };
      })();
    </script>
